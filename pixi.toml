[workspace]
authors = ["minna"]
channels = ["conda-forge", "bioconda", "pytorch", "nodefaults"]
name = "phenium"
platforms = [
    { name = "lida", platform = "linux-64", cuda = "12.0" },
]
version = "0.1.0"

[target.lida.dependencies]
python = "*"
pytorch-gpu = "*"
cuda-version = "12.6.*"
py-opencv = ">=4.12.0,<5"
pyqtgraph = ">=0.14.0,<0.15"
pyqt6 = ">=6.8.1,<7"
imagecodecs = ">=2026.1.14,<2027"
roifile = ">=2026.7.30,<2027"
fastremap = ">=1.20.0,<2"
fill-voids = ">=2.1.2,<3"
cellpose = ">=4.1.1,<5"
rust = ">=1.98.1,<1.99"
geojson = ">=3.3.0,<4"
shapely = ">=2.1.2,<3"
geopandas = ">=1.1.4,<2"
tomlkit = ">=0.15.1,<0.16"
psutil = ">=7.2.2,<8"
tqdm = ">=4.70.0,<5"
scanpy = ">=1.12.4,<2"

[constraints]
pandas = ">2.0,<3.0"

[target.lida.pypi-dependencies]
ovrlpy = ">=1.2.0, <2"
DINOv3 = { git = "https://github.com/facebookresearch/dinov3", rev = "6876159a11b4df116f30f667f8c9888617df0751" }

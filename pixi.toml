[workspace]
authors = ["Philomina"]
channels = [
    "rapidsai", "nvidia", "conda-forge", "bioconda", "pytorch", "nodefaults", 
]
name = "phenium"
platforms = [
    { name = "lida", platform = "linux-64", cuda = "12" },
]
version = "2026.10.2a1"

# [package.build]
# backend = { name = "pixi-build-python", version = "0.*" }

[constraints]
numpy = ">=1.20.0"
pandas = ">2.0,<3.0" 

[dependencies]
python = ">=3.12"
# phenium = { path = "./phenium/" }

[target.lida.dependencies]
antspyx = ">0.6"
celltypist = ">1.7.0"
cuda-version = "==12.9"
cudnn = "*"
cutensor = "*"
cusparselt = "*"
# fast_matrix_market = "==1.7.6"
fastremap = "*"
fill-voids = "*"
geojson = "*"
geopandas = "*"
imagecodecs = "*"
psutil = "*"
pyqtgraph = "*"
pyqt6 = "*"
pytorch-gpu = "*"
rapids = { version = "26.*", channel = "rapidsai" }
roifile = "*"
rust = "==1.88.0"
shapely = "*"
spatialdata = ">=0.7.2"
tifffile = ">=2026,<2027"
tomlkit = "*"
torchvision = "*"
tqdm = "*"
zarr = ">3"

[target.lida.pypi-dependencies]
cellpose = "==4.2.1.1"
DINOv3 = { git = "https://github.com/facebookresearch/dinov3", rev = "6876159a11b4df116f30f667f8c9888617df0751" }
microfilm = "<=0.3.0"
opencv-python-headless = ">=4.13.0"
ovrlpy = "*"
pyarrow = "*"
rapids-singlecell-cu12 = { version = "*" }
spatialdata = { version = "*", extras = ["torch"] }

[workspace]
authors = ["minna"]
channels = ["conda-forge", "bioconda", "nvidia", "pytorch"]
name = "phenium"
platforms = ["linux-64"]
version = "0.1.0"


[dependencies]
python = ">=3.8"
cuda = "12.6.*"
tomlkit = "*"
geopandas = "*"
geojson = "*"
shapely = "*"
psutil = "*"
polars = "*"
pandas = "*"

[pypi-options]
index-url = "https://download.pytorch.org/whl/cu126"

[pypi-dependencies]
bokeh = "*"
cellpose = "==4.2.1.1"
dask = "*"
dask-image = "*"
dask-jobqueue = "*"
DINOv3 = { git = "https://github.com/facebookresearch/dinov3", rev = "6876159a11b4df116f30f667f8c9888617df0751" }
distributed = "*"
fastremap = "*"
fill-voids = "*"
google-cloud-storage = "*"
natsort  = "*"
numpy = "*"
opencv-python-headless = "*"
pyqt5 = "*"
pyqtgraph = ">=0.11.0rc0"
pyyaml = "*"
qtpy = "*"
roifile = "*"
scipy = "*"
tifffile = "*"
torch = ">=1.6"
torchvision = "*"
tqdm = "*"
zarr = "*"


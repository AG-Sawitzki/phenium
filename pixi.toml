[workspace]
authors = ["Philomina"]
channels = [
    "https://prefix.dev/rapidsai",
    "https://prefix.dev/nvidia",
    "https://prefix.dev/conda-forge",
    "https://prefix.dev/bioconda",
    "https://prefix.dev/pytorch",
    "nodefaults", 
]
channel-priority = "flexible"
name = "phenium"
platforms = [
    { name = "lida", platform = "linux-64", cuda = "12" },
]
version = "2026.11.1a1"

# [package.build]
# backend = { name = "pixi-build-python", version = "0.*" }

[constraints]
numpy = ">=1.20.0"
pandas = ">2.0,<3.dev0"

[dependencies]
python = ">=3.13"
ipython = "*"
# phenium = { path = "./phenium/" }

[target.lida.dependencies]
antspyx = ">0.6"
cuda-version = ">=12.9"
cudnn = "*"
# cugraph = { version = "*" }
# cupy = ">13.6.0"
cutensor = "*"
cusparselt = "*"
fastremap = "*"
fill-voids = "*"
geojson = "*"
geopandas = "*"
imagecodecs = "*"
# numba = "*"
pillow = ">=13,<14"
polars = ">=1.38.1"
polars-st = ">=0.11.0,<0.12"
psutil = "*"
pyqtgraph = "*"
pyqt6 = "*"
pytorch-gpu = "*"
rapids = { version = "26.*" }
# rapids-xgboost = { version = "*" }
rich = "<=15.0.0"
roifile = "*"
rust = "==1.88.0"
scanpy = "==1.12.4"
shapely = "*"
spatialdata = ">=0.6.0"
squidpy = ">=1.8.0,<2"
tifffile = ">=2026,<2027"
tomlkit = "*"
torchvision = "*"
tqdm = "*"
zarr = ">3"

[target.lida.pypi-dependencies]
cellpose = "==4.2.1.1"
DINOv3 = { git = "https://github.com/facebookresearch/dinov3", rev = "6876159a11b4df116f30f667f8c9888617df0751" }
microfilm = "<=0.3.0"
opencv-python-headless = ">=4.13.0"
ovrlpy = "==1.2.1"
pyarrow = "*"
rapids-singlecell-cu12 = { version = "*" }
